name: Monitor TCF exam availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a test email before checking the exam page
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tcf-exam-availability-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .monitor-state
          key: tcf-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tcf-monitor-state-

      - name: Check exam availability
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: |
          args=()
          if [[ "$SEND_TEST_EMAIL" == "true" ]]; then
            args+=(--test-email)
          fi
          python -m tcf_monitor "${args[@]}"

      - name: Save monitor state
        if: ${{ always() && hashFiles('.monitor-state/state.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .monitor-state
          key: tcf-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
